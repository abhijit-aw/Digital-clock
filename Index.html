<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Digital Clock</title>

    <link rel="stylesheet" href="Style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- Clock -->
        <div class="clock-box">

            <!-- Left Greeting Panel -->
            <div class="left-panel">

                <div class="sun-icon" id="weatherIcon">☀</div>

                <h3>Good Morning</h3>

                <h2>Abhii</h2>

                <div class="line"></div>

                <p>Focus Mode</p>

                <div class="toggle"></div>

            </div>


            <!-- Main Clock -->
            <div class="clock">

                <p class="title">
                    LIVE CLOCK
                </p>

                <div class="time">

                    <span id="hour">00</span>

                    <span>:</span>

                    <span id="minute">00</span>

                    <span>:</span>

                    <span id="second">00</span>

                </div>

                <div class="labels">

                    <span>Hours</span>

                    <span>Minutes</span>

                    <span>Seconds</span>

                </div>


                <!-- Date -->
                <div class="date-box">

                    <p id="date">
                        Loading...
                    </p>

                    <h3 id="day">
                        Loading...
                    </h3>

                </div>

            </div>

        </div>


        <!-- Bottom Information Bar -->
        <div class="bottom-bar">

            <!-- Location -->
            <div class="info">

                <i class="fa-solid fa-location-dot"></i>

                <h4>Location</h4>

                <p id="location">
                    Detecting...
                </p>

            </div>


            <!-- Weather -->
            <div class="info weather-info">

                <i class="fa-solid fa-cloud-sun" id="weatherSmallIcon"></i>

                <h4>Weather</h4>

                <p id="weather">
                    Loading...
                </p>

            </div>


            <!-- Humidity -->
            <div class="info">

                <i class="fa-solid fa-droplet"></i>

                <h4>Humidity</h4>

                <p id="humidity">
                    Loading...
                </p>

            </div>


            <!-- Wind -->
            <div class="info">

                <i class="fa-solid fa-wind"></i>

                <h4>Wind</h4>

                <p id="wind">
                    Loading...
                </p>

            </div>


            <!-- Time Zone -->
            <div class="info">

                <i class="fa-regular fa-clock"></i>

                <h4>Time Zone</h4>

                <p id="timezone">
                    Detecting...
                </p>

            </div>

        </div>

    </div>


    <script src="Script.js"></script>

</body>

</html>
